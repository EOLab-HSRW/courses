<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">MQTT Keep Alive exchange</title>
<desc id="desc">A client sends normal MQTT traffic, then sends PINGREQ before the keep alive interval expires, and receives PINGRESP.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#326a9d"/></marker><style>.h{font:700 27px sans-serif;fill:#17212b}.t{font:19px sans-serif;fill:#17212b}.m{font:700 19px monospace;fill:#17212b}.life{stroke:#455b70;stroke-width:4}.arr{stroke:#326a9d;stroke-width:4;marker-end:url(#a)}.time{stroke:#9c6b27;stroke-width:3;stroke-dasharray:8 7}.note{font:18px sans-serif;fill:#33495e}</style></defs><rect width="1100" height="620" fill="white"/>
<text class="h" x="260" y="60" text-anchor="middle">Client</text><text class="h" x="840" y="60" text-anchor="middle">Broker</text><line class="life" x1="260" y1="85" x2="260" y2="545"/><line class="life" x1="840" y1="85" x2="840" y2="545"/>
<line class="arr" x1="260" y1="145" x2="830" y2="145"/><text class="m" x="550" y="130" text-anchor="middle">CONNECT — Keep Alive: 60 s</text>
<line class="arr" x1="260" y1="235" x2="830" y2="235"/><text class="m" x="550" y="220" text-anchor="middle">PUBLISH</text><line class="time" x1="190" y1="235" x2="190" y2="390"/><text class="note" x="165" y="320" text-anchor="end">no other MQTT</text><text class="note" x="165" y="345" text-anchor="end">control packet</text>
<line class="arr" x1="260" y1="390" x2="830" y2="390"/><text class="m" x="550" y="375" text-anchor="middle">PINGREQ</text><line class="arr" x1="840" y1="465" x2="270" y2="465"/><text class="m" x="550" y="450" text-anchor="middle">PINGRESP</text>
<text class="note" x="550" y="565" text-anchor="middle">Any MQTT control packet resets the inactivity timer. Keep Alive tests the connection; it does not carry application data.</text>
</svg>
