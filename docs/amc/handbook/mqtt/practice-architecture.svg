<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 520" role="img" aria-labelledby="title desc">
<title id="title">MQTT practice architecture</title><desc id="desc">ESP32 sensor and actuator clients communicate through a broker with desktop subscriber and publisher clients.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#326a9d"/></marker><style>.box{fill:#eef5fb;stroke:#326a9d;stroke-width:3;rx:15}.broker{fill:#dcecf8;stroke:#326a9d;stroke-width:4;rx:18}.h{font:700 25px sans-serif;fill:#17212b}.t{font:18px sans-serif;fill:#17212b}.m{font:700 16px monospace;fill:#17212b}.arr{stroke:#326a9d;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1250" height="520" fill="white"/>
<rect class="box" x="35" y="85" width="270" height="145"/><text class="h" x="170" y="135" text-anchor="middle">ESP32 sensor client</text><text class="t" x="170" y="176" text-anchor="middle">publishes measurements</text><text class="m" x="170" y="208" text-anchor="middle">amc/group/sensors/#</text>
<rect class="box" x="35" y="305" width="270" height="145"/><text class="h" x="170" y="355" text-anchor="middle">ESP32 actuator client</text><text class="t" x="170" y="396" text-anchor="middle">subscribes to commands</text><text class="m" x="170" y="428" text-anchor="middle">amc/group/output/#</text>
<rect class="broker" x="500" y="145" width="250" height="220"/><text class="h" x="625" y="218" text-anchor="middle">MQTT Broker</text><text class="t" x="625" y="260" text-anchor="middle">topic matching</text><text class="t" x="625" y="292" text-anchor="middle">retained values</text><text class="t" x="625" y="324" text-anchor="middle">sessions and Will messages</text>
<rect class="box" x="945" y="85" width="270" height="145"/><text class="h" x="1080" y="135" text-anchor="middle">Desktop subscriber</text><text class="t" x="1080" y="176" text-anchor="middle">observes measurements</text><text class="m" x="1080" y="208" text-anchor="middle">mosquitto_sub / MQTTX</text>
<rect class="box" x="945" y="305" width="270" height="145"/><text class="h" x="1080" y="355" text-anchor="middle">Desktop publisher</text><text class="t" x="1080" y="396" text-anchor="middle">sends actuator commands</text><text class="m" x="1080" y="428" text-anchor="middle">mosquitto_pub / MQTTX</text>
<path class="arr" d="M305 155 C390 155 400 220 490 220"/><path class="arr" d="M500 305 C410 305 395 380 315 380"/><path class="arr" d="M750 220 C840 220 855 155 935 155"/><path class="arr" d="M945 380 C855 380 840 305 760 305"/>
</svg>
