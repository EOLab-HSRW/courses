<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">MQTT publish and subscribe model</title>
<desc id="desc">Client A publishes a temperature message to an MQTT broker. The broker forwards it to subscribed clients B and C.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326a9d"/></marker>
  <style>
    .box{fill:#eef5fb;stroke:#326a9d;stroke-width:3;rx:16}.broker{fill:#dcecf8;stroke:#326a9d;stroke-width:4;rx:18}.title{font:700 28px sans-serif;fill:#17212b}.text{font:22px sans-serif;fill:#17212b}.small{font:18px sans-serif;fill:#17212b}.topic{font:700 19px monospace;fill:#17212b}.arrow{stroke:#326a9d;stroke-width:5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1200" height="520" fill="white"/>
<rect class="box" x="55" y="185" width="230" height="125"/>
<text class="title" x="170" y="235" text-anchor="middle">Client A</text>
<text class="small" x="170" y="275" text-anchor="middle">publisher</text>
<rect class="broker" x="480" y="150" width="240" height="195"/>
<text class="title" x="600" y="225" text-anchor="middle">MQTT Broker</text>
<text class="small" x="600" y="270" text-anchor="middle">receives publications</text>
<text class="small" x="600" y="302" text-anchor="middle">and matches subscriptions</text>
<rect class="box" x="915" y="70" width="230" height="125"/>
<text class="title" x="1030" y="120" text-anchor="middle">Client B</text>
<text class="small" x="1030" y="160" text-anchor="middle">subscriber</text>
<rect class="box" x="915" y="325" width="230" height="125"/>
<text class="title" x="1030" y="375" text-anchor="middle">Client C</text>
<text class="small" x="1030" y="415" text-anchor="middle">subscriber</text>
<path class="arrow" d="M285 247 H470"/>
<text class="text" x="375" y="185" text-anchor="middle">PUBLISH</text>
<text class="topic" x="375" y="215" text-anchor="middle">europe/amsterdam/noord</text>
<text class="small" x="375" y="292" text-anchor="middle">payload: 22 °C</text>
<path class="arrow" d="M720 210 C810 210 830 132 905 132"/>
<path class="arrow" d="M720 285 C810 285 830 387 905 387"/>
<text class="small" x="815" y="95" text-anchor="middle">matching subscription</text>
<text class="small" x="815" y="445" text-anchor="middle">matching subscription</text>
</svg>
