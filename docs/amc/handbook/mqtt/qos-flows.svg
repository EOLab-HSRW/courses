<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">MQTT Quality of Service message flows</title>
<desc id="desc">Comparison of QoS zero, one and two message exchanges between sender and receiver.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#326a9d"/></marker>
<style>.h{font:700 27px sans-serif;fill:#17212b}.t{font:20px sans-serif;fill:#17212b}.p{font:700 18px monospace;fill:#17212b}.life{stroke:#455b70;stroke-width:3}.arr{stroke:#326a9d;stroke-width:4;marker-end:url(#a)}.panel{fill:#f7fafc;stroke:#b8cad9;stroke-width:2;rx:12}.note{font:18px sans-serif;fill:#33495e}</style>
</defs><rect width="1400" height="720" fill="white"/>
<rect class="panel" x="25" y="25" width="430" height="660"/><rect class="panel" x="485" y="25" width="430" height="660"/><rect class="panel" x="945" y="25" width="430" height="660"/>
<text class="h" x="240" y="70" text-anchor="middle">QoS 0 — at most once</text>
<text class="h" x="700" y="70" text-anchor="middle">QoS 1 — at least once</text>
<text class="h" x="1160" y="70" text-anchor="middle">QoS 2 — exactly once</text>
<!-- panel 1 -->
<text class="t" x="95" y="120" text-anchor="middle">Sender</text><text class="t" x="385" y="120" text-anchor="middle">Receiver</text><line class="life" x1="95" y1="140" x2="95" y2="530"/><line class="life" x1="385" y1="140" x2="385" y2="530"/><line class="arr" x1="95" y1="235" x2="375" y2="235"/><text class="p" x="235" y="220" text-anchor="middle">PUBLISH</text><text class="note" x="240" y="580" text-anchor="middle">One packet; no MQTT acknowledgement.</text><text class="note" x="240" y="612" text-anchor="middle">Loss is possible.</text>
<!-- panel 2 -->
<text class="t" x="555" y="120" text-anchor="middle">Sender</text><text class="t" x="845" y="120" text-anchor="middle">Receiver</text><line class="life" x1="555" y1="140" x2="555" y2="530"/><line class="life" x1="845" y1="140" x2="845" y2="530"/><line class="arr" x1="555" y1="220" x2="835" y2="220"/><text class="p" x="695" y="205" text-anchor="middle">PUBLISH</text><line class="arr" x1="845" y1="315" x2="565" y2="315"/><text class="p" x="700" y="300" text-anchor="middle">PUBACK</text><path d="M555 220 C510 235 510 300 555 315" stroke="#9c6b27" stroke-width="3" fill="none" stroke-dasharray="8 7"/><text class="note" x="700" y="580" text-anchor="middle">Retransmission can create duplicates.</text><text class="note" x="700" y="612" text-anchor="middle">The application must tolerate them.</text>
<!-- panel 3 -->
<text class="t" x="1015" y="120" text-anchor="middle">Sender</text><text class="t" x="1305" y="120" text-anchor="middle">Receiver</text><line class="life" x1="1015" y1="140" x2="1015" y2="530"/><line class="life" x1="1305" y1="140" x2="1305" y2="530"/><line class="arr" x1="1015" y1="195" x2="1295" y2="195"/><text class="p" x="1155" y="180" text-anchor="middle">PUBLISH</text><line class="arr" x1="1305" y1="270" x2="1025" y2="270"/><text class="p" x="1160" y="255" text-anchor="middle">PUBREC</text><line class="arr" x1="1015" y1="345" x2="1295" y2="345"/><text class="p" x="1155" y="330" text-anchor="middle">PUBREL</text><line class="arr" x1="1305" y1="420" x2="1025" y2="420"/><text class="p" x="1160" y="405" text-anchor="middle">PUBCOMP</text><text class="note" x="1160" y="580" text-anchor="middle">Four-step exchange prevents duplicates</text><text class="note" x="1160" y="612" text-anchor="middle">at the MQTT delivery interface.</text>
</svg>
